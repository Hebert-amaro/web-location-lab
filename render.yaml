services:
  - type: web
    name: seeker
    env: docker
    plan: free
    autoDeploy: true
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PORT
        value: 8080
      - key: TEMPLATE
        value: "2"
      - key: DEBUG_HTTP
        value: "0"
      - key: TITLE
        value: "Demo Group"
      - key: IMAGE
        value: "template/whatsapp/images/ZIvBTrQd9nP.png"
      - key: REDIRECT
        value: "https://example.com"
      - key: GOOGLE_DRIVE_FOLDER_ID
        value: "1NDf3J1mKjhOEoGxgI8rZjQxlW0JR9WV3"
      # Configure this secret in the Render dashboard; do not commit it to the repository.
      # - key: GOOGLE_SERVICE_ACCOUNT_JSON
      #   value: "{...service account json...}"
